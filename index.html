
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-5">

        <h1 class="text-center mb-4">Manage Your Tasks</h1>

        <!-- Task Input -->
        <div class="input-group mb-3">
            <input
                type="text"
                id="taskInput"
                class="form-control"
                placeholder="Enter a new task"
            >

            <button id="addTaskBtn" class="btn btn-primary">
                Add Task
            </button>
        </div>

        <!-- Error Message -->
        <p id="errorMessage" class="text-danger"></p>

        <!-- Task Counter -->
        <p id="taskCounter">Active tasks: 0</p>

        <!-- Filter Buttons -->
        <div class="btn-group mb-3" role="group">
            <button class="btn btn-outline-primary filter-btn"
                    data-filter="all">All</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">Active</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="list-group mb-3">
        </ul>

        <!-- Clear Completed -->
        <button id="clearCompletedBtn" class="btn btn-danger">
            Clear Completed
        </button>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
